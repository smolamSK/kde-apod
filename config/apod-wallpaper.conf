# Settings for apod-wallpaper (https://github.com/smolamSK/kde-apod).
# Uncomment a line to change it; the values shown are the defaults.

# NASA API key. The shared DEMO_KEY is rate-limited per IP address and runs out quickly.
# Get a free personal key (1,000 requests/hour) at https://api.nasa.gov
#API_KEY=DEMO_KEY

# How far the image and monitor aspect ratios may differ (as a ratio) before switching from
# crop-to-fill to showing the whole image over a blurred background. 1.2 = up to ~17% cropped.
#FIT_THRESHOLD=1.2

# Random mode: pick pictures from the archive since this date (older ones are mostly small),
# and skip any whose longer side is under RANDOM_MIN_SIZE pixels.
#RANDOM_SINCE=2007-01-01
#RANDOM_MIN_SIZE=1920

# Days to keep old images and renders in ~/.local/share/apod-wallpaper/
#KEEP_DAYS=7
